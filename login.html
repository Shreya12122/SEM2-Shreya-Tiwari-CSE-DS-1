<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login or Signup - Myntra</title>
    <meta name="description" content="Login or create an account on Myntra.">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <div class="logo"><a href="index.html"><img src="unnamed.jpeg" alt="Myntra Logo"></a></div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="men.html">Men</a></li>
                    <li><a href="women.html">Women</a></li>
                    <li><a href="login.html" class="active">Login</a></li>
                    <li><a href="cart.html">Cart</a></li>
                </ul>
            </nav>
            <div class="search-bar">
                <form action="#" method="get">
                    <input type="text" name="search" placeholder="Search for products, brands and more">
                    <button type="submit">Go</button>
                </form>
            </div>
        </div>
    </header>
    <main>
        <div class="login-container">
            <h1 class="page-title page-title-centered">Login or Signup</h1>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="form-switch">
                    Don't have an account? <a href="#">Sign Up Now</a>
                </p>
            </form>
        </div>
    </main>
    <footer class="site-footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="about.html">About Us</a>
                <a href="#">Contact</a>
                <a href="privacy.html">Privacy Policy</a>
            </div>
            <div class="footer-credit">
                <p>Made by Shreya Tiwari</p>
                <p>Admission Number: 2025b15410143</p>
            </div>
        </div>
    </footer>
</body>
</html>
